<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>語詞闖關遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <!-- 首頁 -->
  <section id="screen-start" class="screen active">
    <div class="bg" id="start-bg"></div><div class="veil"></div><div class="motes"></div>
    <div class="start-inner">
      <h1 id="game-title"></h1>
      <p id="instructions"></p>
      <div class="start-actions">
        <button id="btn-start" class="btn btn-gold" type="button">開始</button>
        <button id="btn-speak" class="btn btn-round" type="button" aria-label="朗讀說明">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="start-notes">
        <div class="sn"><b>⚡ 勇者趕時間（單人模式）</b>按上面的按鈕直接進入遊戲，挑戰全部題目。</div>
        <a class="sn link" href="adventure.html"><b>👥 多人冒險請先閱讀「冒險篇章」</b>先在設定頁設定好，再開設多人闖關。</a>
      </div>
    </div>
    <span id="custom-tag" class="custom-tag hidden">使用老師自訂題目</span>
    <a class="teacher-link" href="adventure.html">冒險篇章</a>
  </section>

  <!-- 故事 -->
  <section id="screen-story" class="screen">
    <div class="bg" id="story-bg"></div><div class="veil strong"></div><div class="motes"></div>
    <div class="story-wrap">
      <div id="story-card" class="parchment"></div>
      <button id="story-next" class="btn btn-gold" type="button">繼續</button>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="screen-play" class="screen">
    <div class="bg" id="scene-bg"></div><div class="veil soft"></div><div class="motes"></div>
    <header id="hud">
      <div class="hud-left"><div id="hud-room"></div><div id="hud-spells"></div></div>
      <div class="hud-mid">
        <div id="hud-clock">
          <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#2a1f4a" stroke="#e8c15a" stroke-width="3"/><line id="hand-h" x1="20" y1="20" x2="20" y2="11" stroke="#f6f1ff" stroke-width="3" stroke-linecap="round"/><line id="hand-m" x1="20" y1="20" x2="20" y2="7" stroke="#f28c28" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="20" r="2.5" fill="#e8c15a"/></svg>
          <span id="clock-text">11:00</span>
        </div>
        <div id="hud-runes"></div>
      </div>
      <div class="hud-right">
        <div id="hud-score"><span class="lbl">分數</span><span id="score">0</span><span id="hud-time" class="hidden"></span></div>
        <button id="btn-grade" class="btn-small grade-btn hidden" type="button" aria-label="老師批改">📝<span>老師批改</span><span id="grade-badge" class="badge"></span></button>
        <button id="btn-notes" class="btn-small" type="button" aria-label="線索本">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>線索本</span><span id="notes-badge" class="badge hidden"></span>
        </button>
      </div>
    </header>
    <div id="scene"><div id="objects"></div><div id="gate-panel" class="hidden"></div></div>
    <button id="cat" type="button" aria-label="黑貓提示"><img id="cat-img" alt="黑貓"></button>
    <div id="bubble" class="hidden"></div>

    <div id="room-intro" class="overlay hidden"><div class="card intro-card">
      <div id="ri-num"></div><h2 id="ri-title"></h2><p id="ri-text"></p>
      <button id="ri-go" class="btn btn-gold" type="button">開始探索</button>
    </div></div>

    <div id="modal" class="overlay hidden"><div id="modal-card" class="card">
      <div id="m-head"><img id="m-img" alt=""><div class="m-headtext"><div id="m-speaker"></div><div id="m-type"></div></div>
        <button id="m-close" class="btn btn-round small" type="button" aria-label="關閉"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      </div>
      <p id="m-prompt"></p><div id="m-body"></div><div id="m-feedback" class="hidden"></div>
      <div id="m-actions"><span id="m-keyhint"></span><button id="m-continue" class="btn btn-gold hidden" type="button">繼續探索</button></div>
    </div></div>

    <div id="notes" class="overlay hidden"><div class="card">
      <div class="notes-head"><h2>線索本</h2>
        <button id="notes-close" class="btn btn-round small" type="button" aria-label="關閉"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      </div>
      <div id="notes-list"></div><div id="notes-runes"></div>
    </div></div>

    <div id="rune-get" class="overlay hidden"><div class="card rune-card">
      <div id="rg-rune" class="rune-big"></div><h2 id="rg-title"></h2><p id="rg-text"></p>
      <button id="rg-go" class="btn btn-gold" type="button">前往下一個房間</button>
    </div></div>
  </section>

  <!-- 結局 -->
  <section id="screen-end" class="screen">
    <div class="bg" id="end-bg"></div><div class="veil strong"></div><div class="motes"></div>
    <div class="end-inner">
      <img id="end-cat" alt="">
      <h2 id="end-title"></h2>
      <div class="final"><span class="lbl">最終分數</span><span id="final-score">0</span></div>
      <div id="end-stats"></div>
      <div id="end-review"></div>
      <div id="end-grade" class="end-grade hidden">還有 <b id="end-grade-n">0</b> 題手寫／打字題等老師批改，批改答對會再加分。<button id="end-grade-btn" class="btn btn-violet grade-btn" type="button">📝 老師批改</button></div>
      <div class="end-btns"><button id="btn-another" class="btn btn-gold hidden" type="button">接受另一段冒險</button><button id="btn-restart" class="btn btn-gold" type="button">再玩一次</button></div>
    </div>
  </section>
  <div id="grade-ov" class="grade-ov hidden"><div class="grade-card">
    <h2>📝 老師批改</h2><p class="mute">手寫、打字題由老師判斷對錯：田字格題一個字 60 分，每個字分開批改；手寫作答、打字題整題 100 分。</p>
    <div id="grade-list"></div>
    <button id="grade-close" class="btn btn-gold" type="button">批改完成，回到遊戲</button>
  </div></div>
  <div id="fx"></div>
</main>
<script src="share.js"></script>
<script src="content.js"></script>
<script src="settings.js"></script>
<script src="game.js"></script>
</body>
</html>
